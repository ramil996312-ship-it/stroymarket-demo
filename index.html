<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b2d31">
<title>Строймаркет (демо)</title>
<style>
:root{--g:#2b2d31;--g2:#3a3d43;--o:#f28a1e;--o2:#d96f0a;--bg:#f4efe9;--card:#fff;--t:#23252a;--m:#6b6f76}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden}
.demo{background:var(--o);color:#1d1100;text-align:center;font-weight:700;padding:8px 12px;font-size:15px}
header{background:linear-gradient(180deg,var(--g2),var(--g));color:#fff;padding:20px 16px 22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.w{max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;font-size:28px}h1 span{color:var(--o)}
header p{margin:0 0 16px;color:#cfd2d8}
input,select,textarea{width:100%;font:inherit;padding:14px;border:2px solid #d9d2c8;border-radius:12px;background:#fff;color:var(--t);min-height:52px}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.tools{display:grid;gap:10px;grid-template-columns:2fr 1fr}
.btn{font:inherit;font-weight:700;font-size:18px;min-height:52px;padding:0 22px;border:0;border-radius:14px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#ffa03a,var(--o) 55%,var(--o2));box-shadow:0 6px 0 #a94f00,0 10px 18px rgba(120,60,0,.35);text-shadow:0 1px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;margin-bottom:6px}
.btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #a94f00,0 16px 24px rgba(120,60,0,.4)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a94f00,0 3px 6px rgba(120,60,0,.3)}
.btn.dark{background:linear-gradient(180deg,#5a5e66,var(--g2) 55%,var(--g));box-shadow:0 6px 0 #111,0 10px 18px rgba(0,0,0,.35)}
.btn.dark:hover{box-shadow:0 9px 0 #111,0 16px 24px rgba(0,0,0,.4)}
.btn.dark:active{box-shadow:0 1px 0 #111,0 3px 6px rgba(0,0,0,.3)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 12px;max-width:1100px;margin:0 auto;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-weight:600;min-height:46px;padding:0 18px;border-radius:23px;border:2px solid var(--g);background:#fff;color:var(--g);cursor:pointer;box-shadow:0 4px 0 #bdb6aa;transition:transform .12s,box-shadow .12s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #bdb6aa}
.chip[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 4px 0 var(--o)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 32px}
.cnt{color:var(--m);margin:8px 0 14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(60,40,10,.12);border-top:5px solid var(--o);display:flex;flex-direction:column;min-width:0}
.cat{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:6px 0 12px;font-size:18px;line-height:1.3;overflow-wrap:anywhere;flex:1}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pr div{background:#faf6f0;border-radius:12px;padding:8px 10px}
.pr small{display:block;color:var(--m);font-size:13px}
.pr b{font-size:19px}.pr .w2 b{color:var(--o2)}
.st{font-size:14px;margin-bottom:10px}.in{color:#2a7d3a}.out{color:#b3261e}
.card .btn{width:100%}
.more{text-align:center;margin-top:24px}
.empty{padding:40px 0;text-align:center;color:var(--m)}
footer{background:var(--g);color:#e6e6e6;padding:28px 16px 36px}
footer a{color:var(--o);font-weight:700}
footer p{margin:6px 0}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,20,22,.6)}
form{padding:22px;display:grid;gap:12px}
form h2{margin:0;font-size:22px}form .nm{color:var(--m);margin:0}
label{font-weight:600;display:grid;gap:6px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row .btn{flex:1}
.ok{padding:30px 22px;text-align:center}.ok h2{color:#2a7d3a}
body.lock{overflow:hidden}
@media(max-width:600px){.tools{grid-template-columns:1fr}h1{font-size:25px}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.btn.sm{min-height:46px;font-size:16px;padding:0 16px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.lang{display:flex;gap:8px;margin-bottom:10px}
.lang .chip{min-height:46px;padding:0 14px;background:#fff}
.lang .chip[aria-pressed=true]{background:var(--o);border-color:var(--o);color:#1d1100;box-shadow:0 4px 0 #a94f00}
footer .bar{margin:12px 0 0}
footer a.btn{color:#fff}
.calc{background:var(--card);border-radius:18px;padding:18px;margin:8px 0 18px;border-top:5px solid var(--g);box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(60,40,10,.12)}
.calc h2{margin:0 0 12px;font-size:22px}
.cg{display:grid;gap:10px;grid-template-columns:1fr 1fr auto;align-items:end}
.cg label{font-size:15px}
.cg .btn{margin-bottom:0}
.cres{margin:14px 0 0;padding:12px 14px;background:#faf6f0;border-radius:12px}
.cres p{margin:0 0 10px}.cres .btn{margin-bottom:0}
.fab{position:fixed;right:14px;bottom:14px;z-index:20;min-height:56px;display:flex;align-items:center;gap:8px}
.bd{background:#fff;color:var(--o2);border-radius:14px;min-width:28px;padding:0 8px;line-height:28px;text-align:center;text-shadow:none}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 18px;border-radius:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
dialog.big{width:min(560px,calc(100vw - 24px));max-height:92vh;overflow:auto}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #e6dfd4}
.ci .cn{grid-column:1/-1;font-weight:600;overflow-wrap:anywhere}.ci small{display:block;color:var(--m);font-weight:400}
.qty{display:flex;gap:6px;align-items:center}
.qty input{width:68px;min-height:46px;padding:6px;text-align:center}
.qb{font:inherit;font-weight:700;font-size:22px;width:46px;height:46px;border:2px solid var(--g);border-radius:12px;background:#fff;color:var(--g);cursor:pointer;box-shadow:0 3px 0 #bdb6aa}
.qb:active{transform:translateY(2px);box-shadow:none}
.dsc{font-size:13px;color:#2a7d3a;margin:-6px 0 10px;font-weight:600}
.tot{font-size:20px;display:flex;justify-content:space-between;gap:10px;padding-top:6px}
.cb{padding:22px 22px 0}.cb h2{margin:0 0 6px;font-size:22px}
@media(max-width:600px){.cg{grid-template-columns:1fr}.cg .btn{width:100%}footer{padding-bottom:90px}}
.hero{display:block;width:100%;max-height:300px;object-fit:cover;object-position:center 60%}
html{scroll-behavior:smooth}
#kdlg{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}#kdlg[hidden]{display:none}#kdlg img{max-width:100%;max-height:calc(100vh - 170px);border:3px solid #fff;border-radius:12px;background:#000}#kbox{--c:#fff;position:relative;overflow:hidden;box-sizing:border-box;border:3px solid #fff;border-radius:12px;background:#000;aspect-ratio:var(--ar,1.78);width:min(100%,calc((100vh - 170px)*var(--ar,1.78)))}#kbox[hidden]{display:none}#kbox[data-lv=g]{--c:#2fbf5b}#kbox[data-lv=y]{--c:#f2b705}#kbox[data-lv=r]{--c:#e5392d}#kvid{display:block;width:100%;height:100%;object-fit:contain}#kfr{position:absolute;left:10%;top:7%;width:80%;height:86%;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);border:2px solid var(--c);border-radius:6px;pointer-events:none;transition:border-color .25s}#kfr i{position:absolute;width:9%;height:12%;border:0 solid var(--c);transition:border-color .25s}#kfr i:nth-child(1){left:-2px;top:-2px;border-width:6px 0 0 6px}#kfr i:nth-child(2){right:-2px;top:-2px;border-width:6px 6px 0 0}#kfr i:nth-child(3){left:-2px;bottom:-2px;border-width:0 0 6px 6px}#kfr i:nth-child(4){right:-2px;bottom:-2px;border-width:0 6px 6px 0}#kfr b{position:absolute;left:0;right:0;top:6px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}#kshot.g{background:#1b7a34;box-shadow:0 6px 0 #0e4a1e,0 0 0 4px #7be59a}#kshot.y{background:#f2b705;color:#000;text-shadow:none;box-shadow:0 6px 0 #9a7600}#kshot.r{background:#b3261e;box-shadow:0 6px 0 #6e130e}#kq.mid{background:#8a6a00}#kq{font-size:20px}#kdlg .row{justify-content:center}#kst.er{color:#ffb4ab}#kq{margin:0;max-width:560px;width:100%;padding:10px 14px;border-radius:12px;font-weight:700;font-size:17px;text-align:center;background:#333;color:#fff}#kq.ok{background:#1b7a34}#kq.warn{background:#b3261e}#kq small{display:block;font-weight:400;font-size:14px;margin-top:4px}#kq[hidden]{display:none}.btn:disabled{opacity:.6;cursor:default;transform:none}
.vh{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0;border:0;overflow:hidden}
.lst{max-width:1100px;margin:16px auto 0;padding:0 16px}
.lbox{background:var(--card);border-radius:18px;padding:18px;border-top:5px solid var(--o);box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(60,40,10,.12)}
.lbox h2{margin:0 0 6px;font-size:22px}
.lbox>.nm{margin:0 0 12px}
.dz{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:22px 14px;margin-bottom:12px;border:3px dashed #c9bfae;border-radius:16px;background:#faf6f0;cursor:pointer;font-weight:700}
.dz small{font-weight:400;color:var(--m);font-size:14px}
.dz.over,.dz:hover,.dz:focus-within{border-color:var(--o);background:#fff3e3}
.lbox label.tx{margin-bottom:12px}
.lbox textarea{min-height:130px;resize:vertical}
.lstat{min-height:1.4em;margin:10px 0 0;font-weight:600}.lstat.er{color:#b3261e}
.lnote{font-size:14px;color:var(--m);margin:8px 0 0}
#rc{margin-top:18px;padding-top:6px;border-top:2px solid #e6dfd4}
#rc h3{margin:12px 0 4px;font-size:20px}#rc .sb{margin:0 0 10px;color:var(--m);font-size:14px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 120px 46px;gap:6px 10px;align-items:center;padding:12px 0;border-bottom:1px solid #e6dfd4}
.rw.rwh{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.04em;padding:6px 0}
.rwn{min-width:0;font-weight:600;overflow-wrap:anywhere}.rwn select,.rwn input{min-height:46px;padding:8px 10px;font-weight:600}
.rwn small{display:block;font-weight:400;color:var(--m);font-size:13px;margin-top:2px}.rwn .wr{color:#9a5b00}
.rwq{display:flex;gap:6px;align-items:center;white-space:nowrap}.rwq input{width:76px;min-height:46px;padding:6px;text-align:center}
.rwp small{display:block;color:var(--m)}.rwt{font-weight:700;text-align:right}
.pn{display:none}
.rtot{font-size:20px;display:flex;justify-content:space-between;gap:10px;padding:14px 0 4px}
.rbtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.rbtn .btn{flex:1 1 220px;text-align:center}
.ph{display:none}
.rw.bad{background:#fff8ec}
@media(max-width:600px){
.rw{grid-template-columns:auto minmax(0,1fr) 46px;grid-template-areas:"n n n" "q p x" "q t x"}
.rw.rwh{display:none}.rwn{grid-area:n}.rwq{grid-area:q}.rwp{grid-area:p;text-align:right}.rwt{grid-area:t}.rwx{grid-area:x}
.rw.bad .rwq{display:none}.rw.bad{grid-template-areas:"n n x"}
.rbtn .btn{flex-basis:100%}}
@media print{
body>*:not(#lst){display:none!important}
body{background:#fff;font-size:12pt;color:#000}
#lst .np,.rbtn{display:none!important}
.lst{margin:0;padding:0;max-width:none}.lbox{box-shadow:none;border:0;padding:0}
#rc{border:0}.ph{display:block}.ph h2{margin:0 0 4px;font-size:20pt}
.rwn select,.rwn input{display:none}.pn{display:block}
.rwq input{border:0;width:5ch;text-align:right;min-height:0;padding:0;appearance:textfield;-moz-appearance:textfield}
.rw{grid-template-columns:minmax(0,1fr) 140px 110px 110px 0;break-inside:avoid}.rwx{display:none}
.rw.bad{background:none}
}
a.btn.cta{display:flex;width:100%;margin:0 0 14px;font-size:19px}
</style></head><body>

/* Качество кадра. Всё считается на копии шириной 480 px (поэтому не зависит от разрешения камеры).

const QT={darkMean:80,brightMean:215,flat:60,blur:.03,small:.38,blurBad:.012,none:.05,big:.95,sx:.15,sy:.22};
const FR=[.1,.07,.8,.86]; // рамка-прицел в долях кадра (x,y,w,h) — как в CSS #kfr; метрики считаются только внутри неё
function qual(src,sw,sh){const W=480,H=Math.max(8,Math.round(sh*FR[3]*W/(sw*FR[2]))),cv=document.createElement("canvas");cv.width=W;cv.height=H;
 const x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(src,sw*FR[0],sh*FR[1],sw*FR[2],sh*FR[3],0,0,W,H);const p=x.getImageData(0,0,W,H).data,n=W*H,g=new Uint8Array(n),Hh=new Uint32Array(256);
 let sum=0;for(let i=0,j=0;j<n;i+=4,j++){const v=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;g[j]=v;Hh[v]++;sum+=v}
 const pc=q=>{let a=0;for(let v=0;v<256;v++){a+=Hh[v];if(a>=n*q)return v}return 255};
 const mean=sum/n,p5=pc(.05),p95=pc(.95),range=p95-p5,range2=pc(.995)-pc(.01);let bl=0;for(let v=250;v<256;v++)bl+=Hh[v];bl/=n;
 let s1=0,s2=0,c=0;for(let y=1;y<H-1;y++)for(let i=y*W+1,e=y*W+W-1;i<e;i++){const l=4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W];s1+=l;s2+=l*l;c++}
 const lv=s2/c-(s1/c)*(s1/c),sharp=lv/Math.max(900,range*range);
 const B=12,bx=[],by=[],th=Math.max(40,range*.4);for(let by0=0;by0+B<=H;by0+=B)for(let bx0=0;bx0+B<=W;bx0+=B){let lo=255,hi=0;for(let yy=0;yy<B;yy++)for(let xx=0;xx<B;xx++){const v=g[(by0+yy)*W+bx0+xx];if(v<lo)lo=v;if(v>hi)hi=v}if(hi-lo>th){bx.push(bx0);by.push(by0)}}
 let box=0,cx=.5,cy=.5,ww=0,hh=0;if(bx.length>8){const a=bx.slice().sort((u,v)=>u-v),b=by.slice().sort((u,v)=>u-v),i5=Math.floor(a.length*.05),i95=Math.min(a.length-1,Math.floor(a.length*.95));ww=(a[i95]-a[i5]+B)/W;hh=(b[i95]-b[i5]+B)/H;box=ww*hh;cx=(a[i5]+a[i95]+B)/2/W;cy=(b[i5]+b[i95]+B)/2/H}
